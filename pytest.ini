[pytest]
python_files = test_*.py
asyncio_mode = auto
# El ciclo de edición no paga las intersecciones exactas sobre geometría real a
# 2400x2400: son decenas de segundos. CI las corre en un paso aparte.
addopts = -v --tb=short -m "not lento"
markers =
    lento: intersección exacta de geometría real contra la retícula de 2400x2400; decenas de segundos. `pytest -m lento` las corre, y CI siempre.
