[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ntl"
version = "0.10.0"
description = "VNP46A2 satellite nighttime radiance processing"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1.0",
    "pandas>=2.0",
    "aiohttp>=3.9",
    "h5py>=3.10",
    "pydantic>=2.0",
    "beautifulsoup4>=4.10",
    "python-dotenv>=1.0",
    # requests: descarga bloqueante en core.downloader
    "requests>=2.26",
    # scipy y matplotlib: los usa ntl.geometria, que hasta ahora no se
    # distribuía y por eso nunca declaró sus dependencias.
    "scipy>=1.7",
    "matplotlib>=3.4",
    # shapely: intersección exacta polígono-píxel en ntl.geometria.cobertura
    "shapely>=2.0",
]

[project.optional-dependencies]
# Ya no hay extra `api`. La API, el agente y el tablero viven en daily-ntl, que
# es la aplicación; este paquete es la librería que esa aplicación importa, y
# la flecha va en un solo sentido. Declarar aquí FastAPI y un SDK de Gemini
# ponía media aplicación dentro de la librería y daba pie a que las dos
# volvieran a competir.
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    # pyarrow: los resultados y el detalle de fallos se guardan en Parquet.
    "pyarrow>=10.0",
    # pyproj: sin él, las pruebas que comparan la cobertura contra el área
    # geodésica sobre WGS84 se saltan en silencio. Son la verdad-terreno de la
    # tabla: justo las que no pueden faltar en una corrida automática.
    "pyproj>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
# ntl_data ships the municipality coordinate tables that ntl.core.config
# points at (RUTA_MUNICIPIOS, PIXELES_MUNICIPIOS). Without it here, an installed
# copy of this package imports fine and then fails at runtime.
# The glob covers every subpackage; listing them one by one is how the geometry
# half silently stopped being installed.
include = ["ntl*", "ntl_data*"]

[tool.setuptools.package-data]
ntl_data = ["*.json"]
